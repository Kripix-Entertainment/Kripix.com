<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica email | Kripix</title>
    <meta name="description" content="Conferma il tuo indirizzo email.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#07080b">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <script>(function(d){try{if(localStorage.getItem('kripix_theme')==='light')d.dataset.theme='light';}catch(e){}if(!('onpagereveal' in window)&&!matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('page-enter');})(document.documentElement);</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav id="main-nav"></nav>

    <div class="login-container">
        <div class="login-box" style="text-align: center;">
            <div class="login-header">
                <h2 data-i18n="Conferma email">Conferma email</h2>
            </div>
            
            <p id="verify-msg" style="font-family: var(--font-body); font-size:1rem; color:var(--accent-gold); margin-bottom: 30px;">
                Stiamo confermando il tuo indirizzo…
            </p>
            
            <a href="login.html" id="btn-return" class="btn-outline full-width" style="display:none;" data-i18n="Accedi">Accedi</a>
        </div>
    </div>

    <footer id="main-footer" class="kripix-footer"></footer>

    <script type="module">
        import { auth } from './script.js';
        import { applyActionCode } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        document.addEventListener('DOMContentLoaded', async () => {
            const msgEl = document.getElementById('verify-msg');
            const btn = document.getElementById('btn-return');
            
            // Prendiamo il codice dall'URL
            const params = new URLSearchParams(window.location.search);
            const actionCode = params.get('oobCode');

            if (!actionCode) {
                msgEl.innerText = "Questo link non è completo. Apri il link che ti abbiamo mandato via email.";
                msgEl.style.color = "var(--danger)";
                return;
            }

            try {
                // Comunichiamo a Firebase che l'email è confermata!
                await applyActionCode(auth, actionCode);
                
                msgEl.innerText = "Email confermata. Ora puoi accedere.";
                msgEl.style.color = "var(--success)";
                btn.style.display = "inline-block";
                btn.innerText = "Accedi";
                btn.className = "btn-gold full-width";
                
            } catch (error) {
                msgEl.innerText = "Il link è scaduto oppure l'email è già confermata. Prova ad accedere.";
                msgEl.style.color = "var(--danger)";
                btn.style.display = "inline-block";
                btn.innerText = "Vai all'accesso";
            }
        });
    </script>
</body>
</html>
