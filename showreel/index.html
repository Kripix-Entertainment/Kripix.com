<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Kripix Showreel</title>
    <link rel="icon" href="../favicon.ico">
    <style>
        @font-face { font-family: "Montserrat"; font-weight: 300; src: url(assets/fonts/montserrat-latin-300-normal.woff2) format("woff2"); }
        @font-face { font-family: "Montserrat"; font-weight: 500; src: url(assets/fonts/montserrat-latin-500-normal.woff2) format("woff2"); }
        @font-face { font-family: "Montserrat"; font-weight: 700; src: url(assets/fonts/montserrat-latin-700-normal.woff2) format("woff2"); }
        @font-face { font-family: "Montserrat"; font-weight: 900; src: url(assets/fonts/montserrat-latin-900-normal.woff2) format("woff2"); }
        @font-face { font-family: "Courier Prime"; font-weight: 400; src: url(assets/fonts/courier-prime-latin-400-normal.woff2) format("woff2"); }
        @font-face { font-family: "Courier Prime"; font-weight: 700; src: url(assets/fonts/courier-prime-latin-700-normal.woff2) format("woff2"); }

        :root { --bg: #020202; --ivory: #e8e6d9; --gold: #e3c66c; --muted: #888; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: var(--bg); color: var(--ivory); font-family: "Courier Prime", monospace; overflow: hidden; }
        #stage { position: fixed; inset: 0; display: grid; place-items: center; }
        #reel { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; background: #000; }
        #controls { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px 18px; display: flex; gap: 14px; align-items: center;
            background: linear-gradient(transparent, rgba(0,0,0,0.85)); transition: opacity .3s; }
        body.playing #controls { opacity: 0; }
        body.playing:hover #controls { opacity: 1; }
        button { background: var(--gold); color: #000; border: 0; padding: 10px 18px; font: 700 14px "Montserrat", sans-serif; letter-spacing: 3px; cursor: pointer; }
        button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
        input[type=range] { flex: 1; accent-color: var(--gold); }
        #time { font-size: 13px; color: var(--muted); min-width: 92px; text-align: right; }
        #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; letter-spacing: 3px; color: var(--muted); }
        @media (max-width: 600px) { button { padding: 8px 12px; } #time { min-width: 70px; } }
    </style>
    <script type="importmap">
    { "imports": { "three": "./assets/three/three.module.min.js", "three/addons/": "./assets/three/addons/" } }
    </script>
</head>
<body>
    <div id="loading">&gt; INIZIALIZZAZIONE SHOWREEL...</div>
    <div id="stage"><canvas id="reel" width="1920" height="1080" aria-label="Showreel Kripix Entertainment"></canvas></div>
    <div id="controls" hidden>
        <button id="play" type="button">PLAY</button>
        <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Posizione">
        <span id="time">00.0 / 00.0</span>
    </div>
    <audio id="audio" preload="auto"></audio>

    <script type="module">
        import { createReel } from './reel.js';

        const faces = ['300 20px Montserrat', '500 20px Montserrat', '700 20px Montserrat', '900 20px Montserrat',
            '400 20px "Courier Prime"', '700 20px "Courier Prime"'];
        await Promise.all(faces.map(f => document.fonts.load(f, 'AÈÀ')));

        const canvas = document.getElementById('reel');
        const reel = await createReel(canvas);
        window.reel = reel;
        document.getElementById('loading').remove();

        const params = new URLSearchParams(location.search);
        if (params.has('render')) {
            // modalità rendering: tools/render.mjs chiama reel.renderAt(t) per ogni fotogramma
            document.getElementById('controls').remove();
            window.ready = true;
        } else {
            const audio = document.getElementById('audio');
            audio.src = 'assets/soundtrack.m4a';
            const play = document.getElementById('play');
            const scrub = document.getElementById('scrub');
            const time = document.getElementById('time');
            const controls = document.getElementById('controls');
            controls.hidden = false;
            let t = Number(params.get('t') || 0), playing = false, last = 0;
            const fmt = (x) => x.toFixed(1).padStart(4, '0');
            const draw = () => { reel.renderAt(t); scrub.value = Math.round(t / reel.DURATION * 1000); time.textContent = `${fmt(t)} / ${fmt(reel.DURATION)}`; };
            const loop = (now) => {
                if (!playing) return;
                // l'audio guida il tempo quando c'è; altrimenti l'orologio
                if (!audio.error && audio.readyState >= 2 && !audio.paused) t = audio.currentTime;
                else t += (now - last) / 1000;
                last = now;
                if (t >= reel.DURATION) { t = reel.DURATION; stop(); }
                draw();
                if (playing) requestAnimationFrame(loop);
            };
            const stop = () => { playing = false; audio.pause(); play.textContent = 'PLAY'; document.body.classList.remove('playing'); };
            play.addEventListener('click', () => {
                if (playing) return stop();
                if (t >= reel.DURATION - 0.05) t = 0;
                playing = true; play.textContent = 'PAUSA'; document.body.classList.add('playing');
                audio.currentTime = t; audio.play().catch(() => {});
                last = performance.now(); requestAnimationFrame(loop);
            });
            scrub.addEventListener('input', () => { t = scrub.value / 1000 * reel.DURATION; audio.currentTime = t; if (!playing) draw(); });
            draw();
        }
    </script>
</body>
</html>
