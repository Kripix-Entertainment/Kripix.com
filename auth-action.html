<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="local-guard.js"></script>
    <meta name="robots" content="noindex">
    <title>Un attimo… | Kripix</title>
    <script>
        // Firebase manda qui i link delle email: smistiamo verso la pagina giusta
        (function () {
            const params = new URLSearchParams(window.location.search);
            const mode = params.get('mode');
            const all = window.location.search;
            if (mode === 'resetPassword') window.location.replace('reset.html' + all);
            else if (mode === 'verifyEmail') window.location.replace('verify.html' + all);
            else window.location.replace('index.html');
        })();
    </script>
    <style>
        html, body { margin: 0; height: 100%; background: #07080b; color: #94918a; font: 16px system-ui, sans-serif; }
        body { display: grid; place-items: center; }
        @media (prefers-color-scheme: light) { html, body { background: #e8e8e4; color: #5a5b5f; } }
    </style>
</head>
<body>
    <p>Un attimo, ti stiamo portando alla pagina giusta…</p>
</body>
</html>
