<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messaggi | Kripix</title>
    <meta name="description" content="I tuoi messaggi su Kripix.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#07080b">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <script>(function(d){try{if(localStorage.getItem('kripix_theme')==='light')d.dataset.theme='light';}catch(e){}if(!('onpagereveal' in window)&&!matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('page-enter');})(document.documentElement);</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">


    
    <style>
        .chat-app {
            display: grid; grid-template-columns: 340px 1fr;
            height: calc(100dvh - var(--nav-h) - var(--tab-h));
            border-bottom: 1px solid var(--line);
        }
        .sidebar { background: var(--bg-raised); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
        .sidebar-header { padding: 22px 20px 14px; font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; text-transform: uppercase; line-height: 1; color: var(--text); }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-user-row { display: flex; align-items: center; gap: 14px; padding: 14px 20px; cursor: pointer; border-left: 3px solid transparent; transition: background .15s; }
        .chat-user-row:hover { background: var(--surface); }
        .chat-user-row.active { background: var(--surface-2); border-left-color: var(--gold); }
        .chat-user-row.active.overseer { border-left-color: var(--red); }
        .chat-avatar { width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; background: var(--surface-2); font-size: 1.1rem; }
        .chat-info h4 { color: var(--text); font-size: 1rem; margin-bottom: 2px; line-height: 1.2; }
        .chat-user-row.overseer .chat-info h4 { color: var(--red); }
        .chat-info p { color: var(--text-muted); font-size: .82rem; }
        .status-dot { color: var(--success); font-size: .6rem; margin-right: 4px; }
        .status-dot.offline { color: var(--text-faint); }

        .chat-window { background: var(--bg); display: flex; flex-direction: column; position: relative; overflow: hidden; min-height: 0; }
        .chat-header { padding: 16px 28px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
        .messages-area { flex: 1; padding: 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg-bubble { max-width: min(70%, 560px); padding: 11px 16px; font-size: .96rem; line-height: 1.5; position: relative; border-radius: 14px; word-wrap: break-word; }
        .msg-time { font-size: .7rem; color: var(--text-muted); margin-top: 4px; text-align: right; display: block; }
        .msg-out { align-self: flex-end; background: var(--gold); color: var(--on-gold); border-bottom-right-radius: 4px; }
        .msg-out .msg-time { color: inherit; opacity: .7; }
        .msg-in { align-self: flex-start; background: var(--surface-2); color: var(--text); border-bottom-left-radius: 4px; }
        .msg-overseer { align-self: flex-start; background: var(--red-soft); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent); color: var(--text); border-bottom-left-radius: 4px; }

        .chat-input-area { padding: 16px 28px; border-top: 1px solid var(--line); display: flex; gap: 10px; flex-shrink: 0; background: var(--bg-raised); }
        .chat-input { flex: 1; padding: 13px 16px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 99px; color: var(--text); font-size: 1rem; outline: none; }
        .chat-input:focus { border-color: var(--gold); }
        .btn-send { background: var(--gold); color: var(--on-gold); font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; letter-spacing: .06em; text-transform: uppercase; border: none; border-radius: 99px; padding: 0 24px; cursor: pointer; }
        .btn-send:hover { background: var(--text); color: var(--bg); }
        .overseer-block { display: none; width: 100%; text-align: center; padding: 18px; color: var(--text-muted); border-top: 1px solid var(--line); flex-shrink: 0; font-size: .92rem; }

        .empty-chat { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; color: var(--text-muted); text-align: center; padding: 24px; }

        .sidebar-toggle { display: none; position: fixed; top: calc(var(--nav-h) + 12px); left: 12px; z-index: 200; width: 42px; height: 42px; background: var(--gold); color: var(--on-gold); border: none; cursor: pointer; border-radius: 50%; box-shadow: var(--shadow); }

        @media (max-width: 800px) {
            .chat-app { grid-template-columns: 1fr; }
            .sidebar { position: fixed; top: var(--nav-h); left: 0; width: 85vw; max-width: 340px; height: calc(100dvh - var(--nav-h) - var(--tab-h)); z-index: 150; transform: translateX(-100%); transition: transform .3s ease; }
            .sidebar.open { transform: translateX(0); }
            .sidebar-toggle { display: flex; align-items: center; justify-content: center; }
            .sidebar-backdrop { display: none; position: fixed; inset: 0; z-index: 140; background: var(--overlay); }
            .sidebar-backdrop.visible { display: block; }
            .chat-header { padding-left: 66px; }
        }
    </style>
</head>
<body>

    <nav id="main-nav"></nav>

    <!-- Mobile sidebar toggle -->
    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Apri le conversazioni" aria-expanded="false">
        <svg class="icon icon-md" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
    </button>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="chat-app">
        
        <!-- COLONNA SINISTRA: GLI AMICI E OVERSEER -->
        <div class="sidebar">
            <h1 class="sidebar-header" data-i18n="Messaggi">Messaggi</h1>
            <div class="chat-list" id="chat-list-container">
                <!-- Qui Firebase inietterà gli amici e il canale Overseer -->
                <div style="padding: 20px; color: var(--text-muted); font-size: 0.9rem;">
                    Caricamento delle conversazioni…
                </div>
            </div>
        </div>

        <!-- COLONNA DESTRA: LA CHAT -->
        <div class="chat-window">
            
            <!-- Questo copre tutto se non clicchi su un amico -->
            <div class="empty-chat" id="empty-state">
                <span style="opacity: 0.2; margin-bottom: 20px; display: flex;" aria-hidden="true">
                    <svg class="icon" style="width:4rem; height:4rem; stroke-width:1;" viewBox="0 0 24 24"><path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/></svg>
                </span>
                <h2 style="font-size:2rem; margin-bottom:8px;">Scegli una conversazione</h2>
                <p style="color:var(--text-muted)">I tuoi amici compaiono qui. Per aggiungerne uno vai sul tuo <a href="profilo.html" style="color:var(--text)">profilo</a>.</p>
            </div>

            <!-- Header Dinamico -->
            <div class="chat-header">
                <div class="chat-avatar" id="current-chat-avatar">?</div>
                <div>
                    <h3 style="color: var(--text); font-size: 1.2rem; margin: 0; line-height: 1;" id="current-chat-name"></h3>
                    <span id="current-chat-status" style="font-size: 0.85rem; color: var(--text-muted);"></span>
                </div>
            </div>

            <!-- Area Messaggi Dinamica -->
            <div class="messages-area" id="messages-container">
                <!-- Esempio di come appariranno i messaggi:
                <div class="msg-bubble msg-in">
                    Ehi, sei riuscito a craccare il terminale?
                    <span class="msg-time">14:22</span>
                </div>
                <div class="msg-bubble msg-out">
                    Ci sto lavorando, mi serve più tempo.
                    <span class="msg-time">14:25</span>
                </div>
                -->
            </div>

            <!-- Barra di inserimento testo -->
            <div class="chat-input-area" id="input-form">
                <input type="text" id="msg-input" class="chat-input" placeholder="Scrivi un messaggio..." autocomplete="off">
                <button id="btn-send-msg" class="btn-send">Invia</button>
            </div>

            <!-- Blocco Overseer -->
            <div class="overseer-block" id="overseer-block">
                Non puoi rispondere ai messaggi dello staff. Per assistenza scrivi a info@kripix.com.
            </div>

        </div>

    </div>

    <footer id="main-footer" class="kripix-footer"></footer>

<script type="module" src="script.js"></script>
<script type="module">
    import { app, auth, db } from './script.js';
    import { doc, getDoc, onSnapshot, collection, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-functions.js";

    const listContainer = document.getElementById('chat-list-container');
    const emptyState = document.getElementById('empty-state');
    const msgContainer = document.getElementById('messages-container');
    const chatName = document.getElementById('current-chat-name');
    const chatAvatar = document.getElementById('current-chat-avatar');
    const chatStatus = document.getElementById('current-chat-status');
    const inputForm = document.getElementById('input-form');
    const overseerBlock = document.getElementById('overseer-block');
    const msgInput = document.getElementById('msg-input');
    const btnSend = document.getElementById('btn-send-msg');

    const functions = getFunctions(app, 'europe-west1');
    const markChatAsRead = httpsCallable(functions, 'markChatAsRead');

    // State & Sottoscrizioni
    let myUid = null;
    let myProfile = null;
    let currentTargetId = null;
    let currentIsSystemChat = false;
    let unsubscribeMessages = null;
    let unsubscribeChatDoc = null; // Per ascoltare le spunte in tempo reale
    
    let friendIds = [];
    let activeChats = {}; 
    let resolvedProfiles = {}; 

    // Profilo di sistema preimpostato
    resolvedProfiles["KRIPX_OVERSEER_SYSTEM"] = {
        username: "Staff Kripix",
        color: "#ff5555",
        onlineStatus: "online",
        privacy: { invisible: false }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let urlForcedAgentId = urlParams.get('agent');
    if (urlForcedAgentId) { window.history.replaceState({}, document.title, window.location.pathname); }

    onAuthStateChanged(auth, (user) => {
        if (!user) { window.location.href = "login.html"; return; }
        myUid = user.uid;

        // 1. Ascolta il MIO profilo
        onSnapshot(doc(db, "users", myUid), (docSnap) => {
            if (docSnap.exists()) {
                myProfile = docSnap.data();
                friendIds = myProfile.friends || [];
                syncProfilesAndRender();
            }
        });

        // 2. Ascolta le CHAT ATTIVE
        const chatsQuery = query(collection(db, "chats"), where("participants", "array-contains", myUid));
        onSnapshot(chatsQuery, (chatsSnap) => {
            activeChats = {};
            chatsSnap.forEach(cDoc => {
                const cData = cDoc.data();
                if (cData.isSystemChat) {
                    if (!myProfile?.isAdmin) {
                        activeChats["KRIPX_OVERSEER_SYSTEM"] = { ...cData, targetUid: "KRIPX_OVERSEER_SYSTEM", isSystem: true };
                    }
                } else {
                    const otherUid = cData.participants[0] === myUid ? cData.participants[1] : cData.participants[0];
                    activeChats[otherUid] = { ...cData, targetUid: otherUid, isSystem: false };
                }
            });
            syncProfilesAndRender();
        });

        // 3. ARCHITETTURA LIVE: Ascolta i profili degli amici in tempo reale (Online/Offline istantaneo!)
        const friendsQuery = query(collection(db, "users"), where("friends", "array-contains", myUid));
        onSnapshot(friendsQuery, (friendsSnap) => {
            friendsSnap.forEach(fDoc => {
                resolvedProfiles[fDoc.id] = fDoc.data();
            });
            renderSidebar();
        });
    });

    // Sincronizzazione di emergenza per non-amici (es. Overseer o messaggi diretti)
    async function syncProfilesAndRender() {
        let uidsToLoad = new Set([...Object.keys(activeChats).map(k => activeChats[k].targetUid)]);
        if (urlForcedAgentId) uidsToLoad.add(urlForcedAgentId);

        let updated = false;
        for (let uid of uidsToLoad) {
            if (uid && !resolvedProfiles[uid] && uid !== "KRIPX_OVERSEER_SYSTEM") {
                const snap = await getDoc(doc(db, "users", uid));
                if (snap.exists()) {
                    resolvedProfiles[uid] = snap.data();
                    updated = true;
                }
            }
        }
        if (updated) renderSidebar();
    }

    function renderSidebar() {
        listContainer.innerHTML = ''; 

        let chatArray = [];

        Object.keys(activeChats).forEach(chatKey => {
            const chatData = activeChats[chatKey];
            const time = chatData.updatedAt ? chatData.updatedAt.toMillis() : 0;
            chatArray.push({ id: chatKey, time: time, isActive: true });
        });

        friendIds.forEach(uid => {
            if (!activeChats[uid]) {
                chatArray.push({ id: uid, time: 0, isActive: false });
            }
        });

        chatArray.sort((a, b) => b.time - a.time);
        chatArray.forEach(item => createSidebarRow(item.id));

        if (chatArray.length === 0) {
            listContainer.innerHTML = '<div style="padding: 20px; color: var(--text-muted); font-size:0.9rem;">Nessuna conversazione. Aggiungi un amico dal tuo <a href="profilo.html" style="color:var(--text)">profilo</a>.</div>';
        }

        if (urlForcedAgentId) {
            const row = document.getElementById(`chat-row-${urlForcedAgentId}`);
            if (row) { row.click(); urlForcedAgentId = null; }
        }
    }

    function createSidebarRow(chatKey) {
        let isSystem = false;
        let targetUid = chatKey;
        let profile = resolvedProfiles[chatKey];
        let chatData = activeChats[chatKey];
        let title = profile?.username;
        let bgCol = profile?.color || '#e3c66c';

        if (chatKey === "KRIPX_OVERSEER_SYSTEM") {
            isSystem = true; bgCol = "#ff5555";
        }

        if (!profile && !isSystem) return;

        const hasUnread = chatData ? chatData[`unread_${myUid}`] === true : false;
        let isOnline = (profile?.onlineStatus === "online" && (!profile?.privacy || profile.privacy.invisible !== true));
        let statusHTML = isOnline ? `<span class="status-dot">●</span> Online` : `<span class="status-dot offline">●</span> Offline`;
        if (isSystem) statusHTML = `<span class="status-dot" style="color:var(--red);">●</span> Messaggi dallo staff`;

        const div = document.createElement('div');
        div.className = `chat-user-row ${isSystem ? 'overseer' : ''} ${currentTargetId === targetUid ? 'active' : ''}`;
        div.id = `chat-row-${chatKey}`;
        
        let unreadDot = hasUnread && currentTargetId !== targetUid ? `<div class="unread-dot" style="width:10px; height:10px; background:var(--danger); border-radius:50%; margin-left:auto;"></div>` : '';

        div.innerHTML = `
            <div class="chat-avatar" style="background-color: ${String(bgCol).replace(/[^#a-zA-Z0-9(),.%\s-]/g, '')};">${title.charAt(0).toUpperCase()}</div>
            <div class="chat-info" style="flex:1;">
                <h4 class="safe-title"></h4>
                <p>${statusHTML}</p>
            </div>
            ${unreadDot}
        `;
        // Aggiungi questa riga subito dopo per inserire il testo in modo sicuro:
        div.querySelector('.safe-title').textContent = title;

        div.onclick = () => openChat(targetUid, title, bgCol, statusHTML, isSystem, hasUnread);
        listContainer.appendChild(div);
    }

    function openChat(targetUid, title, bgCol, statusHTML, isSystem, hasUnread) {
        document.querySelectorAll('.chat-user-row').forEach(d => d.classList.remove('active'));
        document.getElementById(`chat-row-${targetUid}`).classList.add('active');
        
        emptyState.style.display = 'none';
        currentTargetId = targetUid;
        currentIsSystemChat = isSystem;
        
        chatName.innerText = title;
        chatName.style.color = isSystem ? 'var(--red)' : 'var(--text)';
        chatAvatar.innerText = title.charAt(0).toUpperCase();
        chatAvatar.style.backgroundColor = bgCol;
        chatStatus.innerHTML = statusHTML;

        if (isSystem) {
            inputForm.style.display = 'none';
            overseerBlock.style.display = 'block';
            overseerBlock.innerText = "Non puoi rispondere ai messaggi dello staff. Per assistenza scrivi a info@kripix.com.";
        } else {
            inputForm.style.display = 'flex';
            overseerBlock.style.display = 'none';
        }

        if (hasUnread) markChatAsRead({ targetUid: targetUid, isSystemChat: isSystem });
        
        const dot = document.querySelector(`#chat-row-${targetUid} div[style*="background:var(--danger)"]`);
        if (dot && !dot.classList.contains('chat-avatar')) dot.remove();

        loadMessages(targetUid, isSystem);
        listenToReceiptsLive(targetUid, isSystem); // <--- Inizializza l'ascolto spunte live
    }

    // ========================================================
    // NUOVA ARCHITETTURA: ASCOLTATORE DI RICEVUTE IN TEMPO REALE
    // ========================================================
    function listenToReceiptsLive(targetUid, isSystem) {
        if (unsubscribeChatDoc) unsubscribeChatDoc();
        if (isSystem) return; // Niente spunte per i canali unidirezionali

        const chatId = myUid < targetUid ? `${myUid}_${targetUid}` : `${targetUid}_${myUid}`;

        // Ascoltiamo direttamente le modifiche al documento della chat aperta
        unsubscribeChatDoc = onSnapshot(doc(db, "chats", chatId), (docSnap) => {
            if (docSnap.exists()) {
                const chatData = docSnap.data();
                const receiptEl = document.getElementById('current-receipt');
                if (!receiptEl) return;

                // Controlla se il destinatario ha letto (unread_Target è diventato false)
                const isUnreadByOther = chatData[`unread_${targetUid}`];

                if (isUnreadByOther) {
                    receiptEl.innerText = "Consegnato";
                    receiptEl.className = "msg-receipt receipt-sent";
                } else {
                    receiptEl.innerText = "Letto";
                    receiptEl.className = "msg-receipt receipt-read";
                }
            }
        });
    }

    function loadMessages(targetUid, isSystem) {
        msgContainer.innerHTML = '';
        if (unsubscribeMessages) unsubscribeMessages();

        const chatId = isSystem ? `SYSTEM_${myUid}` : (myUid < targetUid ? `${myUid}_${targetUid}` : `${targetUid}_${myUid}`);
        const q = query(collection(db, `chats/${chatId}/messages`), orderBy("timestamp", "asc"));

        unsubscribeMessages = onSnapshot(q, (snapshot) => {
            if (snapshot.docChanges().length === 0) return;

            if (snapshot.empty) {
                msgContainer.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:0.9rem; margin:20px auto 0;">Nessun messaggio. Scrivi tu per primo.</p>`;
                return;
            }

            if (msgContainer.querySelector('p')) msgContainer.innerHTML = '';

            snapshot.docChanges().forEach((change) => {
                if (change.type === "added") {
                    const msg = change.doc.data();
                    const isMe = msg.sender === myUid;
                    
                    let bubbleClass = "msg-in";
                    if (isMe) bubbleClass = "msg-out"; 
                    else if (msg.isSystemDirective) bubbleClass = "msg-overseer"; 

                    let timeString = "Adesso";
                    if (msg.timestamp) {
                        const date = msg.timestamp.toDate();
                        timeString = date.getHours().toString().padStart(2, '0') + ":" + date.getMinutes().toString().padStart(2, '0');
                    }

                    const msgDiv = document.createElement('div');
                    msgDiv.className = `msg-bubble ${bubbleClass}`;
                    msgDiv.textContent = msg.text; 
                    
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'msg-time';
                    timeSpan.textContent = timeString;
                    
                    msgDiv.appendChild(timeSpan);
                    msgContainer.appendChild(msgDiv);
                }
            });

            // RIPOSIZIONAMENTO SPUNTA: Solo sotto l'ultimo messaggio (se è mio)
            const allMessages = msgContainer.querySelectorAll('.msg-bubble');
            if (allMessages.length > 0) {
                const lastMsg = allMessages[allMessages.length - 1];
                const isLastMsgMine = lastMsg.classList.contains('msg-out');

                let receiptEl = document.getElementById('current-receipt');

                if (isLastMsgMine) {
                    if (!receiptEl) {
                        receiptEl = document.createElement('div');
                        receiptEl.id = 'current-receipt';
                        msgContainer.appendChild(receiptEl);
                    } else {
                        msgContainer.appendChild(receiptEl);
                    }
                    // Forza un aggiornamento immediato della spunta
                    const chatData = activeChats[targetUid];
                    if (chatData) {
                        const isUnreadByOther = chatData[`unread_${targetUid}`];
                        receiptEl.innerText = isUnreadByOther ? "Consegnato" : "Letto";
                        receiptEl.className = isUnreadByOther ? "msg-receipt receipt-sent" : "msg-receipt receipt-read";
                    }
                } else {
                    if (receiptEl) receiptEl.remove();
                }
            }

            msgContainer.scrollTo({ top: msgContainer.scrollHeight, behavior: 'smooth' });
        });
    }

    btnSend.addEventListener('click', async () => {
        const text = msgInput.value.trim();
        if (!text || !currentTargetId) return;

        const tempDiv = document.createElement('div');
        tempDiv.className = `msg-bubble msg-out`;
        tempDiv.style.opacity = '0.5'; 
        tempDiv.textContent = text;
        msgContainer.appendChild(tempDiv);
        msgContainer.scrollTo({ top: msgContainer.scrollHeight, behavior: 'smooth' });

        msgInput.value = '';
        msgInput.focus();

        try {
            const sendMessage = httpsCallable(functions, 'sendMessage');
            await sendMessage({ targetUid: currentTargetId, message: text });
            tempDiv.remove(); 
        } catch (e) {
            tempDiv.style.border = '1px solid #ff5555';
            tempDiv.style.color = 'var(--danger)';
            window.kripixNotify("Messaggio non inviato", "Controlla la connessione e riprova.", "error");
        }
    });

    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') btnSend.click();
    });

    // ── Mobile sidebar toggle ───────────────────────────
    const sidebarEl = document.querySelector('.sidebar');
    const toggleBtn = document.getElementById('sidebar-toggle');
    const backdrop  = document.getElementById('sidebar-backdrop');

    function closeSidebar() {
        sidebarEl.classList.remove('open');
        backdrop.classList.remove('visible');
        toggleBtn.setAttribute('aria-expanded', 'false');
    }

    toggleBtn.addEventListener('click', () => {
        const opening = !sidebarEl.classList.contains('open');
        sidebarEl.classList.toggle('open', opening);
        backdrop.classList.toggle('visible', opening);
        toggleBtn.setAttribute('aria-expanded', String(opening));
    });
    backdrop.addEventListener('click', closeSidebar);

    // Chiudi sidebar quando si seleziona un contatto su mobile
    const origOpenChat = openChat;
    openChat = function(...args) {
        closeSidebar();
        return origOpenChat.apply(this, args);
    };
</script>
</body>
</html>
