<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="local-guard.js"></script>
    <title>Nuova password | Kripix</title>
    <meta name="description" content="Scegli una nuova password per il tuo account Kripix.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#07080b">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <script>(function(d){try{if(localStorage.getItem('kripix_theme')==='light')d.dataset.theme='light';}catch(e){}if(!('onpagereveal' in window)&&!matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('page-enter');})(document.documentElement);</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav id="main-nav"></nav>

    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h2 data-i18n="Nuova password">Nuova password</h2>
                <!-- Qui scriveremo l'email dell'utente una volta verificato il link -->
                <p id="status-text">Controllo del link…</p>
            </div>

            <!-- Il form all'inizio è nascosto. Lo mostriamo solo se il link della mail è valido -->
            <form id="resetForm" class="terminal-form" style="display: none;">
                
                <div class="input-group">
                    <label for="new-pass-input" data-i18n="Nuova password (almeno 8 caratteri e un numero)">Nuova password (almeno 8 caratteri e un numero)</label>
                    <input type="password" id="new-pass-input" placeholder="Nuova password" required autocomplete="new-password">
                </div>
                
                <div class="input-group">
                    <label for="confirm-pass-input" data-i18n="Ripeti la password">Ripeti la password</label>
                    <input type="password" id="confirm-pass-input" placeholder="Ripeti la password" required autocomplete="new-password">
                </div>
                
                <p id="final-reset-msg" class="validation-msg" style="text-align:center; display:none;"></p>
                
                <button type="submit" id="btn-submit" class="btn-gold full-width" data-i18n="Salva la nuova password">Salva la nuova password</button>
            </form>

        </div>
    </div>

    <!-- SCRIPT FIREBASE -->
    <footer id="main-footer" class="kripix-footer"></footer>

    <script type="module">
        import { auth } from './script.js';
        import { verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        document.addEventListener('DOMContentLoaded', async () => {
            const statusText = document.getElementById('status-text');
            const resetForm = document.getElementById('resetForm');
            
            // 1. Firebase mette un codice segreto nell'URL quando clicchi la mail. Lo peschiamo:
            const params = new URLSearchParams(window.location.search);
            const actionCode = params.get('oobCode');

            // Se uno apre la pagina senza aver cliccato il link della mail:
            if (!actionCode) {
                statusText.innerText = "Questo link non è completo. Apri il link che ti abbiamo mandato via email.";
                statusText.style.color = "var(--danger)";
                return;
            }

            // 2. Verifichiamo subito se il link è valido (o se è scaduto/già usato)
            try {
                // verifyPasswordResetCode restituisce l'email dell'utente se il codice è valido
                const userEmail = await verifyPasswordResetCode(auth, actionCode);
                
                // Link valido! Mostriamo l'email e sblocchiamo il form
                statusText.textContent = `Scegli una nuova password per ${userEmail}.`;
                resetForm.style.display = 'block';
                
            } catch (error) {
                statusText.innerText = "Il link è scaduto o è già stato usato. Chiedine uno nuovo dalla pagina di accesso.";
                statusText.style.color = "var(--danger)";
                return;
            }

            // 3. Gestiamo il click sul bottone per cambiare la password
            resetForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const newPass = document.getElementById('new-pass-input').value;
                const confirmPass = document.getElementById('confirm-pass-input').value;
                const btn = document.getElementById('btn-submit');
                const msgEl = document.getElementById('final-reset-msg');
                msgEl.style.display = 'none';

                // Controlli base
                if (newPass.length < 8 || !/\d/.test(newPass)) {
                    showError(msgEl, "La password deve avere almeno 8 caratteri e un numero.");
                    return;
                }
                if (newPass !== confirmPass) {
                    showError(msgEl, "Le due password non sono uguali.");
                    return;
                }

                btn.innerText = "Salvataggio…";
                btn.style.opacity = "0.7";
                btn.style.pointerEvents = "none";

                try {
                    // 4. Inviamo la nuova password a Firebase
                    await confirmPasswordReset(auth, actionCode, newPass);
                    
                    // Fatto!
                    btn.innerText = "Password aggiornata";
                    btn.style.background = 'var(--success)';
                    btn.style.borderColor = 'var(--success)';
                    btn.style.color = 'var(--on-gold)';
                    btn.style.opacity = "1";
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);

                } catch (error) {
                    btn.innerText = "Salva la nuova password";
                    btn.style.opacity = "1";
                    btn.style.pointerEvents = "auto";
                    showError(msgEl, "Non riusciamo a contattare il server. Controlla la connessione e riprova.");
                    console.error(error);
                }
            });
        });

        function showError(element, text) {
            element.innerText = text;
            element.style.display = 'block';
        }
    </script>
</body>
</html>
